<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>AI 雲端互動看板 - 德叔專製版</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root { --bg-dark: #1a0f0a; --accent: #ffb703; }
        * { cursor: none !important; } /* 看板模式隱藏滑鼠 */
        body { margin: 0; background: var(--bg-dark); font-family: "Microsoft JhengHei", sans-serif; overflow: hidden; color: white; }
        #container { display: flex; height: 100vh; width: 100vw; }

        /* 左側圖片區 */
        .food-section { width: 60%; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #bentoImg { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.5s; }

        /* 右側資訊區 */
        .info-panel {
            width: 40%; padding: 60px; display: flex; flex-direction: column; justify-content: center;
            background: linear-gradient(135deg, #2c1e16, #4a3427); position: relative;
        }

        h1 { font-size: 3.5em; color: #faedcd; margin: 0 0 10px 0; }
        .price-tag { font-size: 2.5em; color: var(--accent); margin-bottom: 20px; font-weight: bold; }
        .description { font-size: 1.4em; line-height: 1.6; color: #ddd; margin-bottom: 40px; }
        
        .vote-counter { 
            font-size: 2.5em; background: rgba(255,255,255,0.1); padding: 20px; 
            border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); width: fit-content;
        }

        #statusText { position: absolute; bottom: 20px; left: 60px; font-size: 1.2em; color: #888; }
        #camera-view { position: fixed; bottom: 20px; right: 20px; width: 200px; transform: scaleX(-1); border-radius: 10px; opacity: 0.3; }
        
        /* 閃爍動畫 */
        .flash { animation: flashEffect 0.5s; }
        @keyframes flashEffect { 0% { background: var(--bg-dark); } 50% { background: #6d4c3d; } 100% { background: inherit; } }
    </style>
</head>
<body>

    <div id="container">
        <div class="food-section"><img id="bentoImg" src="" alt="商品圖片"></div>
        <div class="info-panel" id="infoPanel">
            <h1 id="foodName">讀取中...</h1>
            <div class="price-tag" id="foodPrice">--</div>
            <div class="description" id="foodDesc">正在連線至雲端資料庫...</div>
            
            <div class="vote-counter">
                👍 <span id="count">0</span> <span style="font-size: 0.6em;">人推薦</span>
            </div>

            <div id="statusText">系統就緒</div>
        </div>
    </div>

    <video id="camera-view" autoplay playsinline></video>

    <script>
        // ==========================================
        // const GAS_URL = 'https://script.google.com/macros/s/AKfycbzlO2zdyeGiS2obOLYon-ewthDwV38mo4ZiWvXGawftMe8RtyOOgmp3ncYJKO_dvzA7/exec
?type=json';
        // ==========================================
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbz1O2zdyeGiS2obOLYon-ewthDwV38mo4ZiWvXGawftMe8RtyO0Gmp3ncYJKO_dvzA7/exec?type=json'; 

        let menuData = [];
        let currentIndex = 0;
        let isCoolingDown = false;
        let isSwipeLocked = false;
        let xBuffer = [];

        const bentoImg = document.getElementById('bentoImg');
        const foodName = document.getElementById('foodName');
        const foodPrice = document.getElementById('foodPrice');
        const foodDesc = document.getElementById('foodDesc');
        const countDisplay = document.getElementById('count');
        const statusText = document.getElementById('statusText');

        // 從雲端抓取資料
        async function fetchCloudData() {
            try {
                statusText.innerText = "🔄 正在更新雲端菜單...";
                const response = await fetch(GAS_URL);
                const data = await response.json();
                if (data && data.length > 0) {
                    menuData = data;
                    updateDisplay();
                    statusText.innerText = "✅ 雲端連線正常";
                }
            } catch (err) {
                statusText.innerText = "❌ 無法讀取雲端資料";
                console.error(err);
            }
        }

        function updateDisplay() {
            if (menuData.length === 0) return;
            const item = menuData[currentIndex];
            bentoImg.style.opacity = 0;
            setTimeout(() => {
                bentoImg.src = item.img;
                foodName.innerText = item.Name;
                foodPrice.innerText = "NT$ " + (item.Price || "--");
                foodDesc.innerText = item.Description || "";
                countDisplay.innerText = item.Votes || 0;
                bentoImg.style.opacity = 1;
            }, 500);
        }

        // 頁面輪播控制
        function changePage(direction) {
            if (isSwipeLocked || menuData.length <= 1) return;
            isSwipeLocked = true;
            currentIndex = (direction === 'next') ? (currentIndex + 1) % menuData.length : (currentIndex - 1 + menuData.length) % menuData.length;
            updateDisplay();
            setTimeout(() => { isSwipeLocked = false; }, 1000);
        }

        // 投票特效
        function triggerVote() {
            if (isCoolingDown) return;
            isCoolingDown = true;
            confetti({ particleCount: 100, spread: 70, origin: { x: 0.8, y: 0.5 } });
            document.getElementById('infoPanel').classList.add('flash');
            setTimeout(() => document.getElementById('infoPanel').classList.remove('flash'), 500);
            
            // 提示用戶
            statusText.innerText = "💖 感謝你的推薦！";
            setTimeout(() => { 
                isCoolingDown = false; 
                statusText.innerText = "✅ 雲端連線正常";
            }, 3000);
        }

        // MediaPipe 手勢偵測邏輯 (與先前相同)
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                const x = lm[9].x;
                xBuffer.push(x);
                if (xBuffer.length > 5) xBuffer.shift();
                if (!isSwipeLocked && xBuffer.length >= 5) {
                    const deltaX = xBuffer[xBuffer.length - 1] - xBuffer[0];
                    if (deltaX > 0.15) changePage('prev');
                    else if (deltaX < -0.15) changePage('next');
                }
                // 比讚偵測
                const isThumbUp = lm[4].y < lm[2].y && lm[4].y < lm[5].y;
                if (isThumbUp && lm[8].y > lm[6].y && lm[12].y > lm[10].y) triggerVote();
            }
        });

        const camera = new Camera(document.getElementById('camera-view'), {
            onFrame: async () => { await hands.send({image: document.getElementById('camera-view')}); },
            width: 640, height: 480
        });

        // 啟動
        fetchCloudData();
        camera.start();
        setInterval(fetchCloudData, 600000); // 每 10 分鐘自動同步一次雲端
    </script>
</body>
</html>
