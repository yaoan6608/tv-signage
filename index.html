<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>德叔旗艦看板 - 菜單展示版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Oswald:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #ffb703;
            --bg-dark: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
        }

        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg-dark); font-family: 'Noto Sans TC', sans-serif; overflow: hidden; color: var(--text-main); }

        /* 全螢幕容器 */
        #main-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* --- 左側 1/3：動態輪播區 --- */
        .carousel-section {
            width: 33.33%;
            height: 100%;
            position: relative;
            background: #000;
            display: flex;
            flex-direction: column;
            border-right: 2px solid rgba(255,183,3,0.3);
            overflow: hidden;
        }

        .hero-image-wrap { height: 65%; width: 100%; overflow: hidden; }
        #hero-img { width: 100%; height: 100%; object-fit: cover; transition: 0.8s ease; }

        .hero-info {
            height: 35%; padding: 30px; box-sizing: border-box;
            background: linear-gradient(to bottom, #111, #000);
            display: flex; flex-direction: column; justify-content: center;
        }

        #hero-tag { background: var(--primary-gold); color: #000; padding: 5px 15px; border-radius: 4px; font-weight: 900; align-self: flex-start; margin-bottom: 10px; }
        #hero-name { font-size: 2.8rem; margin: 5px 0; font-weight: 900; color: var(--primary-gold); }
        #hero-price { font-size: 3.5rem; font-family: 'Oswald', sans-serif; color: #fff; }

        /* --- 右側 2/3：固定菜單區 --- */
        .menu-section {
            width: 66.66%;
            height: 100%;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .menu-header {
            font-size: 2.5rem; font-weight: 900; margin-bottom: 30px;
            border-bottom: 3px solid var(--primary-gold);
            padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }

        /* 網格佈局：3欄 x 2列 (可根據需要調整) */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 20px;
            flex-grow: 1;
        }

        .menu-item {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
        }

        .menu-item-img {
            width: 100%; height: 140px; border-radius: 8px; object-fit: cover; margin-bottom: 10px;
        }

        .menu-item-name { font-size: 1.4rem; font-weight: bold; margin-bottom: 5px; }
        .menu-item-price { font-size: 1.6rem; color: var(--primary-gold); font-family: 'Oswald', sans-serif; }
        
        /* 動畫 Class */
        .fade-out { opacity: 0; transform: scale(1.05); }
        .fade-in { opacity: 1; transform: scale(1); }

    </style>
</head>
<body>

    <div id="main-container">
        <div class="carousel-section">
            <div class="hero-image-wrap">
                <img id="hero-img" src="" alt="大圖">
            </div>
            <div class="hero-info">
                <div id="hero-tag">店長推薦</div>
                <h1 id="hero-name">載入中...</h1>
                <div id="hero-price">$-</div>
            </div>
        </div>

        <div class="menu-section">
            <div class="menu-header">
                <span>MENU 菜單精選</span>
                <span style="font-size: 1rem; color: #888;" id="clock">00:00:00</span>
            </div>
            <div class="menu-grid" id="menu-grid">
                </div>
        </div>
    </div>

    <script>
        // 🚨 重要：請在此貼入你的 Web App 網址 (?type=json)
        const API_URL = "https://script.google.com/macros/s/AKfycbx7vOlxK0n7k0X91hr0lhE86X07MIFVJ0R30tflX2eLcoBijbd8HP_K_70NzSGP-qjh/exec?type=json";
        
        let allItems = [];
        let carouselIndex = 0;

        async function init() {
            await refreshData();
            // 每 10 秒更換一次左側大圖
            setInterval(rotateCarousel, 8000);
            // 每 30 秒重新抓取一次後端資料（確保同步）
            setInterval(refreshData, 30000);
            // 時鐘
            setInterval(() => {
                document.getElementById('clock').innerText = new Date().toLocaleTimeString();
            }, 1000);
        }

        async function refreshData() {
            try {
                const res = await fetch(API_URL);
                allItems = await res.json();
                if (allItems.length > 0) {
                    renderMenuGrid();
                    if (carouselIndex === 0) rotateCarousel(); // 第一次立即執行
                }
            } catch (e) {
                console.error("資料抓取失敗:", e);
            }
        }

        // 渲染右側網格
        function renderMenuGrid() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = "";
            
            // 展示前 6-9 個項目到菜單區
            allItems.slice(0, 9).forEach(item => {
                const card = document.createElement('div');
                card.className = "menu-item";
                card.innerHTML = `
                    <img class="menu-item-img" src="https://drive.google.com/thumbnail?sz=w400&id=${item.imageid}">
                    <div class="menu-item-name">${item.name}</div>
                    <div class="menu-item-price">NT$ ${item.price}</div>
                `;
                grid.appendChild(card);
            });
        }

        // 左側輪播邏輯
        function rotateCarousel() {
            if (allItems.length === 0) return;
            
            const item = allItems[carouselIndex % allItems.length];
            carouselIndex++;

            const img = document.getElementById('hero-img');
            const name = document.getElementById('hero-name');
            const price = document.getElementById('hero-price');
            const tag = document.getElementById('hero-tag');

            // 切換動畫
            img.style.opacity = 0;
            setTimeout(() => {
                img.src = `https://drive.google.com/thumbnail?sz=w1920&id=${item.imageid}`;
                name.innerText = item.name;
                price.innerText = `NT$ ${item.price}`;
                tag.innerText = item.tag || "今日推薦";
                img.onload = () => img.style.opacity = 1;
            }, 400);
        }

        init();
    </script>
</body>
</html>
